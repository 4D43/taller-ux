<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de Notas Accesible</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Registro de Notas</h1>
      </header>

      <main>
        <section class="form-section">
          <form id="note-form" aria-label="Formulario para agregar nota">
            <div class="form-group">
              <label for="note-title">Título de la nota</label>
              <input
                type="text"
                id="note-title"
                placeholder="Ej. Comprar materiales"
                required
              />
            </div>

            <div class="form-group">
              <label for="note-content">Contenido de la nota</label>
              <textarea
                id="note-content"
                rows="3"
                placeholder="Ej. Comprar cuadernos y lapiceros..."
                required
              ></textarea>
            </div>

            <!-- Prevención de errores: deshabilitado por defecto -->
            <button
              type="submit"
              id="submit-btn"
              class="btn btn-primary"
              disabled
            >
              Guardar Nota
            </button>
          </form>
        </section>

        <section class="notes-section">
          <h2>Mis Notas</h2>
          <div id="notes-list" class="notes-list" aria-live="polite">
            <!-- Las notas se cargan dinámicamente -->
          </div>
        </section>
      </main>
    </div>

    <!-- Componente Toast de notificación con opción a deshacer -->
    <div id="toast" class="toast hidden" role="status" aria-live="polite">
      <span id="toast-message"></span>
      <button id="toast-undo-btn" class="btn btn-link hidden">Deshacer</button>
    </div>

    <script src="app.js"></script>
  </body>
</html>
